<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <title>Roma Estudios – Enquesta per Nou Espai</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050509;
      color: #f5f5f5;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 960px;
      background: #111119;
      border-radius: 16px;
      padding: 28px 22px 22px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    header {
      margin-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 14px;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 0.98rem;
      opacity: 0.8;
    }

    .description {
      margin-top: 10px;
      font-size: 0.9rem;
      opacity: 0.75;
      line-height: 1.4;
    }

    .form-wrapper {
      margin-top: 18px;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    iframe {
      width: 100%;
      border: none;
      min-height: 900px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 18px 14px 14px;
      }

      .brand {
        font-size: 1.1rem;
      }

      iframe {
        min-height: 1050px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div class="brand">Roma Estudios</div>
      <div class="subtitle">Enquesta per Nou Espai</div>
      <p class="description">
        Gràcies per haver treballat a Roma Estudios. Aquesta enquesta ens ajuda a
        decidir si té sentit obrir un nou espai més cèntric i a millorar l’experiència
        de rodatge per a les properes produccions. Només et portarà uns minuts.
      </p>
    </header>

    <section class="form-wrapper">
      <iframe
        src="https://docs.google.com/forms/d/e/1FAIpQLSeQSGYGv7aFVEG4Rvp2sxldjHE8g21j7MNRYdpIVeqosK77Qg/viewform?embedded=true"
        loading="lazy"
      >
      </iframe>
    </section>
  </main>
</body>
</html>
